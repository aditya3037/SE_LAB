```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Website</title>

    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        /* Navigation Bar */
        header {
            background-color: #232f3e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Search Bar */
        .search {
            text-align: center;
            margin: 25px;
        }

        .search input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search button {
            padding: 10px 15px;
            background-color: #ff9900;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Products Section */
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        /* Individual Product Card */
        .product {
            background-color: white;
            width: 200px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        .product h3 {
            margin: 10px 0;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 18px;
        }

        .product button {
            background-color: #ff9900;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        .product button:hover,
        .search button:hover {
            background-color: #e68a00;
        }

        /* Footer */
        footer {
            background-color: #232f3e;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>ShopEasy</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#footer">Contact</a>
        </nav>
    </header>

    <!-- Search Bar -->
    <div class="search">
        <input type="text" placeholder="Search products...">
        <button>Search</button>
    </div>

    <!-- Products -->
    <section class="products" id="products">

        <div class="product">
            <img src="https://placehold.co/200x150?text=Headphones"
                 alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x150?text=Smartphone"
                 alt="Smartphone">
            <h3>Smartphone</h3>
            <p class="price">₹14,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x150?text=Watch"
                 alt="Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹1,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x150?text=Shoes"
                 alt="Shoes">
            <h3>Sports Shoes</h3>
            <p class="price">₹2,499</p>
            <button>Add to Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer id="footer">
        <p>Contact us: support@shopeasy.com</p>
        <p>&copy; 2026 ShopEasy. All rights reserved.</p>
    </footer>

</body>
</html>
